
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventario Hospital Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {font-family:'Inter',sans-serif;margin:0;background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;}
header{padding:20px;text-align:center;font-size:22px;font-weight:600;}
.container{max-width:900px;margin:30px auto;background:#1e293b;padding:20px;border-radius:12px;box-shadow:0 10px 25px rgba(0,0,0,0.4);} 
.top-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px;}
input{padding:10px;border-radius:8px;border:none;flex:1;}
button{padding:10px 15px;border:none;border-radius:8px;cursor:pointer;font-weight:500;}
.btn-add{background:#22c55e;color:white;} 
.btn-add:hover{background:#16a34a;} 
table{width:100%;border-collapse:collapse;margin-top:10px;} 
th{padding:12px;background:#334155;text-align:left;} 
td{padding:12px;border-bottom:1px solid #334155;} 
.low{color:#f87171;font-weight:600;} 
.actions button{margin-right:5px;background:#475569;color:white;} 
.actions button:hover{background:#64748b;} 
.alert{margin-bottom:10px;padding:10px;text-align:center;border-radius:8px;} 
.ok{background:#16a34a;} 
.footer{text-align:center;font-size:12px;margin-top:20px;opacity:0.6;}
</style>

<!-- ✅ FIREBASE BIEN PUESTO -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

</head>
<body>
<header>🏥 Inventario Hospital Pro</header>
<div class="container">
<div id="mensaje"></div>
<div class="top-bar">
<input id="nombre" placeholder="Nombre del producto">
<input id="cantidad" type="number" placeholder="Cantidad">
<button class="btn-add" onclick="agregarProducto()">Añadir</button>
</div>
<table>
<thead>
<tr><th>Producto</th><th>Cantidad</th><th>Acciones</th></tr>
</thead>
<tbody id="tabla"></tbody>
</table>
</div>
<div class="footer">Sistema de Inventario v1.0</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDSv2CHZF9GBuAPR-ue02U_uLDwgrBrxjc",
  authDomain: "inventario-hospital.firebaseapp.com",
  projectId: "inventario-hospital-74eaa"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function cargarDatos(){
const tabla=document.getElementById('tabla');
tabla.innerHTML="";

db.collection("productos").get().then(snapshot=>{
 snapshot.forEach(doc=>{
  const item=doc.data();
  tabla.innerHTML+=`<tr>
  <td>${item.nombre}</td>
  <td class="${item.cantidad<=3?'low':''}">${item.cantidad}</td>
  <td class="actions">
  <button onclick="editar('${doc.id}','${item.nombre}',${item.cantidad})">✏️</button>
  <button onclick="eliminar('${doc.id}')">🗑️</button>
  </td></tr>`;
 });
});}

function agregarProducto(){
const n=nombre.value,c=parseInt(cantidad.value);
if(!n||isNaN(c))return alert('Faltan datos');

db.collection("productos").add({nombre:n,cantidad:c})
.then(()=>{mostrarMensaje('✅ añadido');cargarDatos();});
limpiar();}

function eliminar(id){
if(confirm('¿Eliminar producto?')){
 db.collection("productos").doc(id).delete()
 .then(()=>{mostrarMensaje('Eliminado');cargarDatos();});}}

function editar(id,n,c){
let nn=prompt('Nombre',n),nc=prompt('Cantidad',c);
if(!nn||isNaN(nc))return;

db.collection("productos").doc(id).update({nombre:nn,cantidad:parseInt(nc)})
.then(()=>{mostrarMensaje('Actualizado');cargarDatos();});}

function limpiar(){nombre.value='';cantidad.value='';}

function mostrarMensaje(t){
mensaje.className='alert ok';
mensaje.innerText=t;
setTimeout(()=>mensaje.innerText='',2000);}

cargarDatos();
</script>

</body>
</html>
